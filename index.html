<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Adventure Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: white;
        }
        canvas {
            background: linear-gradient(to bottom, #0f172a, #1e1b4b);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game States: 'start', 'playing', 'win'
    let gameState = 'start';

    // Controls
    const keys = {
        ArrowRight: false,
        ArrowLeft: false,
        ArrowUp: false,
        Space: false,
        Enter: false
    };

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowRight') keys.ArrowRight = true;
        if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
        if (e.code === 'ArrowUp') keys.ArrowUp = true;
        if (e.code === 'Space') keys.Space = true;
        
        if (e.code === 'Enter') {
            if (gameState === 'start') {
                initGame();
                gameState = 'playing';
            } else if (gameState === 'win') {
                initGame();
                gameState = 'playing';
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight') keys.ArrowRight = false;
        if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
        if (e.code === 'ArrowUp') keys.ArrowUp = false;
        if (e.code === 'Space') keys.Space = false;
    });

    // Camera and World
    let cameraX = 0;
    const worldWidth = 3500;
    const groundY = 320;

    // Game Objects
    let player, obstacles, potions, witch, magic, balloons;

    function initGame() {
        cameraX = 0;
        
        player = {
            x: 100,
            y: groundY - 60,
            width: 40,
            height: 60,
            dx: 0,
            dy: 0,
            speed: 3, // Slow walking speed for a 5-year-old
            jumpPower: -10, // Floaty jump
            gravity: 0.3,
            potionsCollected: 0,
            direction: 1 // 1 for right, -1 for left
        };

        magic = { active: false, x: 0, y: 0, speed: 6, radius: 15 };

        // Generate Level
        obstacles = [
            { type: 'pumpkin', x: 600, y: groundY - 40, width: 45, height: 40 },
            { type: 'cauldron', x: 900, y: groundY - 45, width: 50, height: 45 },
            { type: 'pumpkin', x: 1300, y: groundY - 40, width: 45, height: 40 },
            { type: 'cauldron', x: 1700, y: groundY - 45, width: 50, height: 45 },
            { type: 'pumpkin', x: 2100, y: groundY - 40, width: 45, height: 40 },
            { type: 'cauldron', x: 2500, y: groundY - 45, width: 50, height: 45 }
        ];

        potions = [
            { x: 600, y: groundY - 120, width: 30, height: 40, collected: false },
            { x: 1100, y: groundY - 60, width: 30, height: 40, collected: false },
            { x: 1500, y: groundY - 120, width: 30, height: 40, collected: false },
            { x: 1900, y: groundY - 60, width: 30, height: 40, collected: false },
            { x: 2300, y: groundY - 120, width: 30, height: 40, collected: false }
        ];

        witch = {
            x: 3200,
            y: groundY - 80, // Hovering low so magic hits perfectly
            width: 70,
            height: 80,
            defeated: false,
            floatY: 0,
            floatDir: 0.2
        };

        balloons = [];
        for (let i = 0; i < 30; i++) {
            balloons.push({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 400,
                radius: 20 + Math.random() * 15,
                color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                speed: 1 + Math.random() * 2
            });
        }
    }

    // --- Drawing Functions for Advanced Graphics ---

    function drawPrincess(x, y, w, h, dir) {
        ctx.save();
        ctx.translate(x + w/2, y + h/2);
        ctx.scale(dir, 1);
        ctx.translate(-(x + w/2), -(y + h/2));

        // Dress
        ctx.fillStyle = '#ff66b2';
        ctx.beginPath();
        ctx.moveTo(x + w/2, y + 20);
        ctx.lineTo(x + w, y + h - 5);
        ctx.lineTo(x, y + h - 5);
        ctx.fill();

        // Head
        ctx.fillStyle = '#ffdfc4';
        ctx.beginPath();
        ctx.arc(x + w/2, y + 15, 12, 0, Math.PI * 2);
        ctx.fill();

        // Hair
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.arc(x + w/2, y + 12, 13, Math.PI, 0);
        ctx.fill();

        // Crown
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(x + 10, y + 5);
        ctx.lineTo(x + 15, y - 5);
        ctx.lineTo(x + 20, y + 5);
        ctx.lineTo(x + 25, y - 5);
        ctx.lineTo(x + 30, y + 5);
        ctx.fill();

        ctx.restore();
    }

    function drawPumpkin(x, y, w, h) {
        // Stem
        ctx.fillStyle = '#228b22';
        ctx.fillRect(x + w/2 - 3, y - 5, 6, 10);
        
        // Body
        ctx.fillStyle = '#ff7518';
        ctx.beginPath();
        ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes and Mouth
        ctx.fillStyle = '#331100';
        ctx.beginPath(); ctx.moveTo(x + 10, y + 15); ctx.lineTo(x + 18, y + 15); ctx.lineTo(x + 14, y + 22); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + w - 10, y + 15); ctx.lineTo(x + w - 18, y + 15); ctx.lineTo(x + w - 14, y + 22); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w/2, y + 28, 8, 0, Math.PI, false); ctx.fill();
    }

    function drawCauldron(x, y, w, h) {
        // Pot
        ctx.fillStyle = '#2a2a2a';
        ctx.beginPath();
        ctx.arc(x + w/2, y + h/2 + 5, w/2, 0, Math.PI * 2);
        ctx.fill();
        
        // Rim
        ctx.fillStyle = '#111';
        ctx.ellipse(x + w/2, y + 10, w/2 + 2, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bubbles
        ctx.fillStyle = '#32cd32';
        const time = Date.now() / 200;
        ctx.beginPath(); ctx.arc(x + 15, y + 5 + Math.sin(time)*3, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 25, y + 0 + Math.sin(time+1)*4, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 35, y + 6 + Math.sin(time+2)*3, 5, 0, Math.PI*2); ctx.fill();
    }

    function drawPotion(x, y, w, h) {
        // Liquid Glow
        ctx.shadowColor = '#d100ff';
        ctx.shadowBlur = 10;
        
        // Flask Body
        ctx.fillStyle = '#9932cc';
        ctx.beginPath();
        ctx.moveTo(x + w/2, y);
        ctx.lineTo(x + w/2 - 5, y + 15);
        ctx.lineTo(x + 5, y + h);
        ctx.lineTo(x + w - 5, y + h);
        ctx.lineTo(x + w/2 + 5, y + 15);
        ctx.fill();

        ctx.shadowBlur = 0; // reset
        
        // Cork
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(x + w/2 - 4, y - 4, 8, 6);
    }

    function drawWitch(x, y, w, h) {
        // Broom
        ctx.strokeStyle = '#654321';
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(x, y + h - 15); ctx.lineTo(x + w, y + h - 10); ctx.stroke();
        ctx.fillStyle = '#daa520';
        ctx.beginPath(); ctx.moveTo(x + w, y + h - 10); ctx.lineTo(x + w + 15, y + h - 20); ctx.lineTo(x + w + 15, y + h); ctx.fill();

        // Dress
        ctx.fillStyle = '#4b0082';
        ctx.beginPath(); ctx.moveTo(x + w/2, y + 20); ctx.lineTo(x + 10, y + h - 20); ctx.lineTo(x + w - 10, y + h - 15); ctx.fill();

        // Face
        ctx.fillStyle = '#32cd32';
        ctx.beginPath(); ctx.arc(x + w/2, y + 25, 12, 0, Math.PI*2); ctx.fill();

        // Hat
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.moveTo(x + w/2, y - 10); ctx.lineTo(x + 10, y + 20); ctx.lineTo(x + w - 10, y + 20); ctx.fill();
        ctx.fillRect(x + 5, y + 18, w - 10, 5);
    }

    // --- Game Logic ---

    function update() {
        if (gameState !== 'playing') return;

        // Player horizontal movement
        if (keys.ArrowRight) {
            player.dx = player.speed;
            player.direction = 1;
        } else if (keys.ArrowLeft) {
            player.dx = -player.speed;
            player.direction = -1;
        } else {
            player.dx = 0;
        }

        // Apply movement and solid block collisions
        let nextX = player.x + player.dx;
        let hitWall = false;

        // Prevent walking backwards past the start
        if (nextX < 100) nextX = 100;
        
        // Solid Obstacle Collision Check
        for (let obs of obstacles) {
            if (nextX + player.width > obs.x && nextX < obs.x + obs.width && player.y + player.height > obs.y + 10) {
                hitWall = true;
            }
        }

        if (!hitWall) {
            player.x = nextX;
        }

        // Player Jump
        if (keys.ArrowUp && player.y >= groundY - player.height) {
            player.dy = player.jumpPower;
        }

        player.y += player.dy;
        player.dy += player.gravity;

        // Floor collision
        if (player.y > groundY - player.height) {
            player.y = groundY - player.height;
            player.dy = 0;
        }

        // Camera strictly follows player
        cameraX = player.x - 200;
        if (cameraX < 0) cameraX = 0;

        // Collect Potions
        for (let p of potions) {
            if (!p.collected && 
                player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                p.collected = true;
                player.potionsCollected++;
            }
        }

        // Boss Logic
        if (player.x > 2800) {
            witch.y += witch.floatDir;
            if (witch.y > groundY - 70 || witch.y < groundY - 90) {
                witch.floatDir *= -1;
            }

            // Shoot Magic
            if (keys.Space && !magic.active && !witch.defeated) {
                magic.active = true;
                magic.x = player.x + player.width;
                magic.y = player.y + player.height / 2;
            }

            // Magic physics
            if (magic.active) {
                magic.x += magic.speed;
                
                // Hit witch
                if (magic.x > witch.x && magic.y > witch.y && magic.y < witch.y + witch.height) {
                    witch.defeated = true;
                    magic.active = false;
                    setTimeout(() => { gameState = 'win'; }, 1000);
                }

                if (magic.x > cameraX + canvas.width) {
                    magic.active = false;
                }
            }
        }
    }

    function draw() {
        // Clear background
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'start') {
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = '40px Comic Sans MS';
            ctx.fillText('🎃 Halloween Adventure 🎃', canvas.width/2, 150);
            ctx.font = '24px Comic Sans MS';
            ctx.fillStyle = '#ffcc00';
            ctx.fillText('Press ENTER to Start', canvas.width/2, 220);
            ctx.fillStyle = '#cccccc';
            ctx.font = '18px Comic Sans MS';
            ctx.fillText('Left/Right Arrows to Walk', canvas.width/2, 280);
            ctx.fillText('Up Arrow to Jump', canvas.width/2, 310);
            ctx.fillText('Spacebar to cast Magic (at the end)', canvas.width/2, 340);
            return;
        }

        if (gameState === 'win') {
            // Draw balloons
            for (let b of balloons) {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.ellipse(b.x, b.y, b.radius, b.radius * 1.2, 0, 0, Math.PI * 2);
                ctx.fill();
                b.y -= b.speed; // Animate up
                
                // string
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + b.radius * 1.2);
                ctx.lineTo(b.x, b.y + b.radius * 1.2 + 20);
                ctx.stroke();
            }

            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = '50px Comic Sans MS';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 10;
            ctx.fillText('YOU WON! 🎉', canvas.width/2, 180);
            ctx.font = '24px Comic Sans MS';
            ctx.fillStyle = '#ffcc00';
            ctx.fillText('Press ENTER to Play Again', canvas.width/2, 250);
            ctx.shadowBlur = 0;
            return;
        }

        // --- DRAW PLAYING STATE ---
        ctx.save();
        ctx.translate(-cameraX, 0);

        // Draw Moon
        ctx.fillStyle = '#ffffe0';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(cameraX + 400, 100, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Ground
        ctx.fillStyle = '#2d4a22';
        ctx.fillRect(cameraX, groundY, canvas.width, canvas.height - groundY);
        ctx.fillStyle = '#1b2d14';
        ctx.fillRect(cameraX, groundY + 15, canvas.width, canvas.height - groundY);

        // Obstacles
        for (let obs of obstacles) {
            if (obs.type === 'pumpkin') drawPumpkin(obs.x, obs.y, obs.width, obs.height);
            if (obs.type === 'cauldron') drawCauldron(obs.x, obs.y, obs.width, obs.height);
        }

        // Potions
        for (let p of potions) {
            if (!p.collected) {
                // Bobbing animation
                const bobY = p.y + Math.sin(Date.now() / 300 + p.x) * 5;
                drawPotion(p.x, bobY, p.width, p.height);
            }
        }

        // Witch Boss
        if (player.x > 2400 && !witch.defeated) {
            drawWitch(witch.x, witch.y, witch.width, witch.height);
        }

        // Player
        drawPrincess(player.x, player.y, player.width, player.height, player.direction);

        // Magic Spell
        if (magic.active) {
            ctx.fillStyle = '#00ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(magic.x, magic.y, magic.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(magic.x, magic.y, magic.radius / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        ctx.restore();

        // UI Layer (Fixed to screen)
        ctx.fillStyle = 'white';
        ctx.font = '24px Comic Sans MS';
        ctx.textAlign = 'left';
        ctx.fillText(`Potions: ${player.potionsCollected} / 5`, 20, 40);

        if (player.x > 2800 && !witch.defeated) {
            ctx.fillStyle = '#ffcc00';
            ctx.textAlign = 'center';
            ctx.fillText('Press SPACE to use Magic!', canvas.width/2, 80);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Start game loop
    initGame();
    loop();
</script>
</body>
</html>
