<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halloween Adventure Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1025; /* Creepy dark purple */
            font-family: 'Fredoka One', cursive, sans-serif;
            touch-action: none;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        .kid-btn {
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: 4px solid #fff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        
        .kid-btn:active {
            transform: scale(0.95);
        }

        .hidden { display: none !important; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-anim {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Head Up Display (HUD) -->
    <div id="hud" class="absolute top-4 left-4 z-10 hidden flex-col gap-2">
        <div class="text-white text-4xl drop-shadow-md bg-black bg-opacity-50 px-6 py-3 rounded-full border-4 border-purple-500">
            🧪 <span id="potionCount">0</span>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="startScreen" class="ui-layer bg-black bg-opacity-80 interactive z-20">
        <div class="bg-purple-900 border-8 border-orange-500 rounded-3xl p-8 max-w-lg text-center shadow-2xl float-anim">
            <h1 class="text-5xl text-orange-400 mb-4 drop-shadow-lg" style="-webkit-text-stroke: 2px #fff;">Halloween Adventure</h1>
            <p class="text-2xl text-white mb-6">Help the Princess 👸 find the Bad Witch 🧙‍♀️!</p>
            <div class="text-left text-xl text-purple-200 mb-8 space-y-4 bg-purple-950 p-6 rounded-xl border-4 border-purple-700">
                <p>➡️ <b>Move Right:</b> Right Arrow Key</p>
                <p>⬅️ <b>Move Left:</b> Left Arrow Key</p>
                <p>⬆️ <b>Jump:</b> Up Arrow Key</p>
                <p>✨ <b>Magic:</b> Spacebar (Use on Witch!)</p>
            </div>
            <div class="kid-btn text-purple-900 font-bold text-4xl px-12 py-5 rounded-full uppercase tracking-wider inline-block">Press ENTER to Play!</div>
        </div>
    </div>

    <!-- Win Screen -->
    <div id="winScreen" class="ui-layer interactive z-20 hidden">
        <div class="bg-blue-600 bg-opacity-95 border-8 border-yellow-400 rounded-3xl p-10 max-w-lg text-center shadow-2xl float-anim mt-20">
            <h1 class="text-7xl text-yellow-300 mb-4 drop-shadow-lg" style="-webkit-text-stroke: 3px #fff;">YOU WON!</h1>
            <p class="text-3xl text-white mb-8 font-bold">The Princess defeated the Witch!</p>
            <div class="kid-btn text-blue-900 font-bold text-4xl px-12 py-5 rounded-full uppercase tracking-wider inline-block">Press ENTER to Play Again</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const startScreen = document.getElementById('startScreen');
        const winScreen = document.getElementById('winScreen');
        const hud = document.getElementById('hud');
        const potionCountEl = document.getElementById('potionCount');

        // Game Constants optimized for 5yo
        const GRAVITY = 0.4; 
        const JUMP_POWER = -11; 
        const PLAYER_SPEED = 4.5; 
        const GROUND_HEIGHT = 120;
        const WORLD_WIDTH = 4000; 
        
        let state = 'MENU'; // MENU, PLAYING, WIN
        let frame = 0;
        let score = 0;
        let animationId;
        
        // Input state
        const keys = {
            ArrowRight: false,
            ArrowLeft: false,
            ArrowUp: false,
            Space: false
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Camera {
            constructor() {
                this.x = 0;
            }
            update(playerX) {
                // Keep player in the center of the screen
                this.x = playerX - canvas.width / 2;
                // Clamp camera to world bounds
                if (this.x < 0) this.x = 0;
                if (this.x > WORLD_WIDTH - canvas.width) this.x = WORLD_WIDTH - canvas.width;
            }
        }

        class Player {
            constructor() {
                this.width = 60;
                this.height = 70; // Slightly taller bounding box for emoji
                this.x = 200;
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.vx = 0;
                this.vy = 0;
                this.grounded = true;
                this.facingRight = true;
            }

            draw(camX) {
                ctx.font = `60px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.save();
                // Draw relative to camera
                let drawX = this.x - camX + this.width / 2;
                let drawY = this.y + this.height / 2;
                
                ctx.translate(drawX, drawY);
                if (!this.facingRight) {
                    ctx.scale(-1, 1); // Flip horizontally if moving left
                }
                ctx.fillText('👸', 0, 5); // Slight Y offset to visually align emoji in bounding box
                ctx.restore();
            }

            update(obstacles) {
                // Horizontal Movement
                this.vx = 0;
                if (keys.ArrowRight) {
                    this.vx = PLAYER_SPEED;
                    this.facingRight = true;
                }
                if (keys.ArrowLeft) {
                    this.vx = -PLAYER_SPEED;
                    this.facingRight = false;
                }

                this.x += this.vx;
                
                // Keep inside world bounds
                if (this.x < 0) this.x = 0;
                if (this.x > WORLD_WIDTH - this.width) this.x = WORLD_WIDTH - this.width;

                // Horizontal Collision with solid obstacles
                for (let obs of obstacles) {
                    if (this.isCollidingWith(obs)) {
                        if (this.vx > 0) { // Moving right, hit left side of obstacle
                            this.x = obs.x - this.width;
                        } else if (this.vx < 0) { // Moving left, hit right side
                            this.x = obs.x + obs.width;
                        }
                    }
                }

                // Vertical Movement & Gravity
                this.vy += GRAVITY;
                this.y += this.vy;
                this.grounded = false;

                // Ground Collision
                const groundY = canvas.height - GROUND_HEIGHT - this.height;
                if (this.y >= groundY) {
                    this.y = groundY;
                    this.vy = 0;
                    this.grounded = true;
                }

                // Vertical Collision with solid obstacles (Landing on top)
                for (let obs of obstacles) {
                    if (this.isCollidingWith(obs)) {
                        if (this.vy > 0) { // Falling down onto obstacle
                            this.y = obs.y - this.height;
                            this.vy = 0;
                            this.grounded = true;
                        } else if (this.vy < 0) { // Jumping up into obstacle
                            this.y = obs.y + obs.height;
                            this.vy = 0;
                        }
                    }
                }
            }

            jump() {
                if (this.grounded) {
                    this.vy = JUMP_POWER;
                    this.grounded = false;
                }
            }

            isCollidingWith(rect) {
                return (
                    this.x < rect.x + rect.width &&
                    this.x + this.width > rect.x &&
                    this.y < rect.y + rect.height &&
                    this.y + this.height > rect.y
                );
            }
        }

        class Obstacle {
            constructor(x, y, size, emoji) {
                this.x = x;
                this.y = y;
                this.width = size;
                this.height = size;
                this.emoji = emoji;
            }
            draw(camX) {
                ctx.font = `${this.width}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Draw relative to camera
                if (this.x - camX > -100 && this.x - camX < canvas.width + 100) {
                    ctx.fillText(this.emoji, this.x - camX + this.width/2, this.y + this.height/2);
                }
            }
        }

        class Potion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.startY = y;
                this.angle = Math.random() * Math.PI * 2;
                this.collected = false;
            }
            update() {
                this.angle += 0.05;
                this.y = this.startY + Math.sin(this.angle) * 15; // Bob up and down
            }
            draw(camX) {
                if (this.collected) return;
                ctx.font = `40px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (this.x - camX > -100 && this.x - camX < canvas.width + 100) {
                    ctx.fillText('🧪', this.x - camX + this.width/2, this.y + this.height/2);
                }
            }
        }

        class Projectile {
            constructor(x, y, facingRight) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.speed = facingRight ? 12 : -12;
                this.active = true;
            }
            update() {
                this.x += this.speed;
            }
            draw(camX) {
                if (!this.active) return;
                ctx.font = `40px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✨', this.x - camX + this.width/2, this.y + this.height/2);
            }
        }

        class Witch {
            constructor(x) {
                this.x = x;
                this.width = 100;
                this.height = 100;
                this.baseY = canvas.height - GROUND_HEIGHT - this.height - 20; // Hovering height
                this.y = this.baseY;
                this.angle = 0;
                this.active = true;
            }
            update() {
                if (!this.active) return;
                this.angle += 0.04;
                this.y = this.baseY + Math.sin(this.angle) * 30; // Float up and down
            }
            draw(camX) {
                if (!this.active) return;
                ctx.font = `${this.width}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let drawX = this.x - camX + this.width/2;
                
                // Only draw if on screen
                if (drawX > -100 && drawX < canvas.width + 200) {
                    ctx.save();
                    ctx.translate(drawX, this.y + this.height/2);
                    ctx.scale(-1, 1); // Face left towards player
                    ctx.fillText('🧙‍♀️', 0, 0);
                    ctx.restore();

                    // Prompt to shoot
                    ctx.font = `24px 'Fredoka One'`;
                    ctx.fillStyle = '#ffde00';
                    ctx.fillText('Press SPACE!', drawX, this.y - 40);
                }
            }
        }

        class Particle {
            constructor(x, y, emoji, isBalloon = false) {
                this.x = x;
                this.y = y;
                this.emoji = emoji;
                this.isBalloon = isBalloon;
                if (isBalloon) {
                    this.size = Math.random() * 40 + 40;
                    this.speedY = Math.random() * -3 - 2;
                    this.speedX = Math.sin(Math.random() * Math.PI) * 2;
                    this.life = 1000; // Lives long
                } else {
                    this.size = 20 + Math.random() * 15;
                    this.speedY = (Math.random() - 0.5) * 8;
                    this.speedX = (Math.random() - 0.5) * 8;
                    this.life = 25;
                }
                this.maxLife = this.life;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
            }
            draw(camX) {
                ctx.globalAlpha = this.isBalloon ? 1 : Math.max(0, this.life / this.maxLife);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Balloons are screen space, particles are world space
                let drawX = this.isBalloon ? this.x : this.x - camX;
                ctx.fillText(this.emoji, drawX, this.y);
                ctx.globalAlpha = 1;
            }
        }

        let player;
        let camera;
        let obstacles = [];
        let potions = [];
        let projectiles = [];
        let particles = [];
        let witch;

        function initGame() {
            player = new Player();
            camera = new Camera();
            obstacles = [];
            potions = [];
            projectiles = [];
            particles = [];
            score = 0;
            frame = 0;
            state = 'PLAYING';
            potionCountEl.innerText = score;

            // Generate Level Layout
            const groundY = canvas.height - GROUND_HEIGHT;
            
            // Place obstacles (generous spacing for 5yo)
            for (let i = 800; i < WORLD_WIDTH - 800; i += 600) {
                let isPumpkin = Math.random() > 0.5;
                let size = isPumpkin ? 60 : 80;
                let emoji = isPumpkin ? '🎃' : '🥘';
                obstacles.push(new Obstacle(i, groundY - size, size, emoji));
            }

            // Place Potions (Floating slightly above jump height, or easy to grab)
            for (let i = 500; i < WORLD_WIDTH - 600; i += 450) {
                potions.push(new Potion(i, groundY - 180));
            }

            // Place Boss
            witch = new Witch(WORLD_WIDTH - 400);

            startScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            hud.classList.remove('hidden');

            if(animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function drawBackground() {
            // Night Sky
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#120a1c');
            skyGradient.addColorStop(1, '#2d1b40');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Moon (fixed to screen)
            ctx.fillStyle = '#ffde00';
            ctx.beginPath();
            ctx.arc(canvas.width - 150, 120, 70, 0, Math.PI * 2);
            ctx.fill();

            // Parallax Trees/Mansion silhouettes
            ctx.fillStyle = '#0a0510';
            // Slow down the background movement relative to camera
            let parallaxX = camera.x * 0.3; 
            
            // Draw a few repeating background elements
            for (let i = -1; i < (WORLD_WIDTH / 800) + 1; i++) {
                let baseX = (i * 800) - parallaxX;
                
                // Only draw if roughly on screen to save performance
                if (baseX > -400 && baseX < canvas.width + 400) {
                    // Tree silhouette
                    ctx.beginPath();
                    ctx.moveTo(baseX + 150, canvas.height - GROUND_HEIGHT);
                    ctx.lineTo(baseX + 180, canvas.height - GROUND_HEIGHT - 250);
                    ctx.lineTo(baseX + 210, canvas.height - GROUND_HEIGHT);
                    ctx.fill();

                    // House silhouette
                    ctx.fillRect(baseX + 400, canvas.height - GROUND_HEIGHT - 200, 200, 200);
                    ctx.beginPath();
                    ctx.moveTo(baseX + 380, canvas.height - GROUND_HEIGHT - 200);
                    ctx.lineTo(baseX + 500, canvas.height - GROUND_HEIGHT - 320);
                    ctx.lineTo(baseX + 620, canvas.height - GROUND_HEIGHT - 200);
                    ctx.fill();
                    
                    // Lit Windows
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(baseX + 440, canvas.height - GROUND_HEIGHT - 120, 30, 40);
                    ctx.fillRect(baseX + 530, canvas.height - GROUND_HEIGHT - 120, 30, 40);
                    ctx.fillStyle = '#0a0510'; // reset
                }
            }

            // Draw Ground
            ctx.fillStyle = '#222f3e';
            ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
            
            // Grass trim on ground
            ctx.fillStyle = '#10ac84';
            ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 15);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (state === 'PLAYING') {
                player.update(obstacles);
                camera.update(player.x);
                witch.update();

                // Check Potion collection
                for (let p of potions) {
                    if (!p.collected) {
                        p.update();
                        // Simple distance-based collision
                        let dx = (player.x + player.width/2) - (p.x + p.width/2);
                        let dy = (player.y + player.height/2) - (p.y + p.height/2);
                        let distance = Math.sqrt(dx*dx + dy*dy);
                        
                        if (distance < (player.width/2 + p.width/2)) {
                            p.collected = true;
                            score++;
                            potionCountEl.innerText = score;
                            createParticles(p.x + p.width/2, p.y + p.height/2, '✨', 8);
                        }
                    }
                }

                // Projectile Logic
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let proj = projectiles[i];
                    proj.update();
                    
                    // Remove if off screen
                    if (proj.x < camera.x || proj.x > camera.x + canvas.width) {
                        proj.active = false;
                    }

                    // Check Boss Hit
                    if (witch.active && proj.active) {
                        let dx = (proj.x + proj.width/2) - (witch.x + witch.width/2);
                        let dy = (proj.y + proj.height/2) - (witch.y + witch.height/2);
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < (proj.width/2 + witch.width/2)) {
                            witch.active = false;
                            proj.active = false;
                            winGame();
                        }
                    }

                    if (!proj.active) projectiles.splice(i, 1);
                }
            } else if (state === 'WIN') {
                // Keep spawning balloons
                if (frame % 8 === 0) {
                    let colors = ['🎈', '🎈', '🎉', '🎊', '🎀'];
                    let emoji = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(Math.random() * canvas.width, canvas.height + 50, emoji, true));
                }
            }

            drawBackground();

            // Draw level objects
            for (let obs of obstacles) obs.draw(camera.x);
            for (let p of potions) p.draw(camera.x);
            witch.draw(camera.x);
            for (let proj of projectiles) proj.draw(camera.x);
            
            // Draw player
            if (state !== 'WIN' || player.y < canvas.height) {
                player.draw(camera.x);
            }

            // Draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(camera.x);
                if (particles[i].life <= 0 || particles[i].y < -100) {
                    particles.splice(i, 1);
                }
            }

            frame++;
            animationId = requestAnimationFrame(gameLoop);
        }

        function createParticles(x, y, emoji, count) {
            for (let i=0; i<count; i++) {
                particles.push(new Particle(x, y, emoji, false));
            }
        }

        function shootMagic() {
            if (state === 'PLAYING') {
                // Offset spawn point based on facing direction
                let spawnX = player.facingRight ? player.x + player.width : player.x - 40;
                projectiles.push(new Projectile(spawnX, player.y + 20, player.facingRight));
                createParticles(spawnX + 20, player.y + 35, '✨', 4);
            }
        }

        function winGame() {
            state = 'WIN';
            hud.classList.add('hidden');
            createParticles(witch.x + witch.width/2, witch.y + witch.height/2, '💥', 25);
            createParticles(witch.x + witch.width/2, witch.y + witch.height/2, '✨', 25);
            
            setTimeout(() => {
                winScreen.classList.remove('hidden');
            }, 1500); 
        }

        // Keyboard Event Listeners (Strictly Keyboard Only for gameplay)
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = true;
                
                // Prevent default scrolling for game keys
                if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'Space') {
                    e.preventDefault();
                }

                // Trigger actions on press
                if (e.code === 'ArrowUp' && state === 'PLAYING') {
                    player.jump();
                }
                if (e.code === 'Space' && state === 'PLAYING') {
                    shootMagic();
                }
            }

            // Start or Restart the game using Enter key
            if (e.code === 'Enter') {
                if (state === 'MENU' || state === 'WIN') {
                    initGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = false;
            }
        });

        // Initial setup render
        resizeCanvas();
        camera = new Camera();
        drawBackground();
        
    </script>
</body>
</html>
